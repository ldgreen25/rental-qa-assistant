<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rental questions | Desirable Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Loaded inside a frame by embed.js. Transparent background so only the
   button and the box show on the host site. */
:root{
  --navy:#16324F;--navy-deep:#0F2439;--porch:#F4C152;--porch-soft:#FDF3DA;
  --bg:#F4F6F7;--paper:#FFFFFF;--ink:#1D2933;--muted:#5A6A75;--line:#D9E0E4;
  --display:"Bricolage Grotesque",Georgia,sans-serif;--body:"Atkinson Hyperlegible",Arial,sans-serif;
}
:root{color-scheme:normal}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:var(--body);color:var(--ink);-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--porch);outline-offset:2px;border-radius:6px}
/* Launcher + panel (embeddable widget) */
.launch{position:fixed;right:22px;bottom:22px;z-index:20;display:flex;align-items:center;gap:10px;border:2px solid var(--navy);border-radius:999px;padding:13px 20px 13px 16px;background:var(--porch);color:var(--navy);font:700 16px var(--body);cursor:pointer;box-shadow:0 10px 30px rgba(15,36,57,.25)}
.launch:hover{background:#F7CD6C}
.panel{position:fixed;right:22px;bottom:90px;z-index:30;width:min(410px,calc(100vw - 28px));height:min(640px,calc(100vh - 118px));background:var(--paper);border-radius:18px;box-shadow:0 24px 60px rgba(15,36,57,.3);display:none;flex-direction:column;overflow:hidden;border:2px solid var(--navy)}
.panel.open{display:flex;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.head{background:var(--navy);color:#fff;padding:16px 16px 16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.head-id{display:flex;align-items:center;gap:12px}
.head-mark{width:38px;height:38px;border-radius:10px;background:var(--porch);display:grid;place-items:center;flex:none}
.head h2{font-family:var(--display);font-weight:700;margin:0;font-size:19px;line-height:1.2}
.head p{margin:2px 0 0;font-size:13px;opacity:.8}
.close{border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:10px;font-size:22px;line-height:1;cursor:pointer}
.close:hover{background:rgba(255,255,255,.22)}
.demo-bar{background:var(--porch-soft);color:#6B5212;font-size:12px;text-align:center;padding:6px 10px;border-bottom:1px solid #EBD39A}
.messages{flex:1;overflow:auto;padding:16px;background:var(--bg)}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.5;white-space:pre-line}
.bot{background:var(--paper);border:1px solid var(--line);border-top-left-radius:4px}
.user{background:var(--navy);color:#fff;margin-left:auto;border-top-right-radius:4px}
.msg a.go{display:inline-block;margin-top:10px;padding:8px 12px;border-radius:9px;background:var(--porch-soft);border:1px solid #EBD39A;color:var(--navy);font-weight:700;font-size:14px;text-decoration:none}
.msg a.go:hover{background:var(--porch)}
.typing{display:inline-flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}
.popular{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--paper);border-top:1px solid var(--line);scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--navy);border-radius:999px;padding:7px 12px;font:700 13px var(--body);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--navy);background:var(--porch-soft)}
#form{display:flex;gap:8px;padding:10px 12px 12px;background:var(--paper)}
#input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;font-size:16px;outline:none}
#input:focus{border-color:var(--navy)}
.send{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:0 16px;font:700 15px var(--body);cursor:pointer}
.fine{text-align:center;padding:0 14px 12px;color:var(--muted);font-size:11px;background:var(--paper)}
/* Phone: the box fills the screen */
html.full .panel{inset:0;width:auto;height:auto;border-radius:0;border:0}
html.full .launch{right:auto;left:12px;bottom:12px;padding:8px 13px 8px 11px;gap:7px;font-size:13px;border-width:1.5px;box-shadow:0 6px 16px rgba(15,36,57,.22)}
html.full .launch svg{width:16px;height:16px}
html.full .head{padding:12px 12px 12px 14px;gap:10px}
html.full .head-id{gap:10px;min-width:0}
html.full .head-mark{width:30px;height:30px;border-radius:8px}
html.full .head-mark svg{width:16px;height:16px}
html.full .head h2{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.full .head p{font-size:12px}
html.full .close{width:30px;height:30px;font-size:20px;flex:none}
html.full .messages{padding:12px}
html.full .msg{font-size:14px;max-width:92%;padding:10px 12px;margin:6px 0}
html.full .popular{padding:8px 10px;gap:5px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
html.full .popular::-webkit-scrollbar{display:none}
html.full .chip{font-size:12px;padding:6px 10px}
html.full #form{padding:8px 10px 10px}
html.full #input{padding:10px 11px}
html.full .send{padding:0 13px;font-size:14px}
html.full .fine{font-size:10px;padding:0 12px 9px}
html.full .launch[aria-expanded="true"]{visibility:hidden}
@media(prefers-reduced-motion:reduce){.panel.open{animation:none}.typing i{animation:none;opacity:.7}}
</style>
</head>
<body>
<button class="launch" id="launch" aria-controls="panel" aria-expanded="false">
  <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
  Ask a question
</button>

<section class="panel" id="panel" role="dialog" aria-label="Desirable Management rental questions">
  <div class="head">
    <div class="head-id">
      <div class="head-mark"><svg width="20" height="20" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 14 15 5l11 9v12H4z" fill="#16324F"/></svg></div>
      <div><h2>Ask Desirable Management</h2><p>Answers about renting with us</p></div>
    </div>
    <button class="close" id="close" aria-label="Close">×</button>
  </div>
  <div class="demo-bar" id="demoBar">Preview: answers pending final review</div>
  <div class="messages" id="messages" aria-live="polite"></div>
  <div class="popular" id="chips" aria-label="Common questions"></div>
  <form id="form"><input id="input" placeholder="Type your question" autocomplete="off" aria-label="Type your question"><button class="send">Send</button></form>
  <div class="fine">Answers are general information, not an approval decision.</div>
</section>
<script src="answers.js"></script>
<script>
/* ---------- Talking to the host page (embed.js) ---------- */
const inFrame=window.parent!==window;
function tellHost(state){
  if(!inFrame)return;
  const msg={type:"dm-qa",state};
  if(state==="closed"){const r=document.getElementById("launch").getBoundingClientRect();msg.w=Math.ceil(r.width)+44;msg.h=Math.ceil(r.height)+44}
  window.parent.postMessage(msg,"*");
}
function setFull(on){const was=document.documentElement.classList.contains("full");document.documentElement.classList.toggle("full",!!on);if(was!==!!on&&!document.getElementById("panel").classList.contains("open"))tellHost("closed")}
if(inFrame){
  window.addEventListener("message",e=>{if(e.source===window.parent&&e.data&&e.data.type==="dm-qa-host")setFull(e.data.mobile)});
}else{
  const fit=()=>setFull(innerWidth<560);fit();addEventListener("resize",fit);
}
/* ---------- Chat UI ---------- */
const stages=[
  {title:"Before you apply",step:"1",note:"Qualifications, fees and what to bring.",items:["How to apply","Application fee","Documents needed","Income requirements","Credit requirements","Rental & background history","Housing assistance","Pet policy","Schedule a showing"]},
  {title:"After approval",step:"2",note:"Holding your home and getting the keys.",items:["Approval time","Deposit / move-in costs","Lease length","Renters insurance","Utilities"]},
  {title:"Living here",step:"3",note:"Rent, repairs and resident perks.",items:["Paying rent","Maintenance requests","Resident Benefit Package","Contact us"]}
];
const panel=document.getElementById("panel"),messages=document.getElementById("messages"),inp=document.getElementById("input"),launch=document.getElementById("launch");
if(!PREVIEW_MODE){document.getElementById("demoBar").remove()}
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function add(t,c,link){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;if(link){d.appendChild(document.createElement("br"));let a=document.createElement("a");a.className="go";a.href=link.href;a.target="_blank";a.rel="noopener";a.textContent=link.text;d.appendChild(a)}messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d}
function ask(q){
  add(q,"user");const m=findMatch(q);
  const t=document.createElement("div");t.className="msg bot typing";t.innerHTML="<i></i><i></i><i></i>";t.setAttribute("aria-label","Typing");messages.appendChild(t);messages.scrollTop=messages.scrollHeight;
  const asked=messages.lastElementChild.previousElementSibling;
  setTimeout(()=>{t.remove();m?add(m.answer,"bot",m.link):add(FALLBACK,"bot");
    if(asked)messages.scrollTop=Math.max(0,asked.offsetTop-messages.offsetTop-8)},reduce?0:450);
}
function openPanel(){tellHost("open");panel.classList.add("open");launch.setAttribute("aria-expanded","true");if(!messages.children.length)add("Hi! Ask me anything about renting with Desirable Management, or tap a common question below.","bot")}
function closePanel(){panel.classList.remove("open");launch.setAttribute("aria-expanded","false");tellHost("closed");launch.focus()}
launch.onclick=()=>{panel.classList.contains("open")?closePanel():(openPanel(),setTimeout(()=>inp.focus(),80))};
document.getElementById("close").onclick=closePanel;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&panel.classList.contains("open"))closePanel()});
document.getElementById("form").onsubmit=e=>{e.preventDefault();let q=inp.value.trim();if(q){inp.value="";ask(q)}};

for(const name of popular){let b=document.createElement("button");b.className="chip";b.type="button";b.textContent=name;b.onclick=()=>ask(name);document.getElementById("chips").appendChild(b)}
const ready=()=>tellHost(panel.classList.contains("open")?"open":"closed");
(document.fonts?document.fonts.ready:Promise.resolve()).then(ready);ready();
</script>
</body>
</html>
